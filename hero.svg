<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00f5d4"/><stop offset=".35" stop-color="#00bbf9"/>
    <stop offset=".7" stop-color="#9b5de5"/><stop offset="1" stop-color="#f15bb5"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="neonStatic" x1="0" x2="1"><stop offset="0" stop-color="#00f5d4"/><stop offset="1" stop-color="#f15bb5"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00f5a0" stop-opacity=".35"/><stop offset="1" stop-color="#00f5a0" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  <radialGradient id="orb1"><stop offset="0" stop-color="#9b5de5" stop-opacity=".45"/><stop offset="1" stop-color="#9b5de5" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb2"><stop offset="0" stop-color="#00bbf9" stop-opacity=".35"/><stop offset="1" stop-color="#00bbf9" stop-opacity="0"/></radialGradient>
  <clipPath id="tickerClip"><rect x="0" y="372" width="1000" height="38"/></clipPath>
</defs>
<style>
  .mono{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}
  .line{opacity:0;animation:show .25s ease-out forwards}
  @keyframes show{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .cursor{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .candle{opacity:0;animation:pop .45s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.2s 1s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fade{opacity:0;animation:fadein 1s 2.6s forwards}
  @keyframes fadein{to{opacity:1}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .float1{animation:f1 9s ease-in-out infinite} .float2{animation:f2 11s ease-in-out infinite}
  @keyframes f1{50%{transform:translate(40px,20px)}} @keyframes f2{50%{transform:translate(-50px,-15px)}}
  .g1{animation:gl1 4s infinite} .g2{animation:gl2 4s infinite}
  @keyframes gl1{0%,90%,100%{transform:none;opacity:0}92%{transform:translate(-4px,1px);opacity:.8}94%{transform:translate(3px,-2px);opacity:.8}96%{transform:none;opacity:0}}
  @keyframes gl2{0%,90%,100%{transform:none;opacity:0}92%{transform:translate(4px,-1px);opacity:.8}94%{transform:translate(-3px,2px);opacity:.8}96%{transform:none;opacity:0}}
  .tick{animation:scroll 28s linear infinite}
  @keyframes scroll{to{transform:translateX(-1329px)}}
  .scan{animation:scan 5s linear infinite}
  @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(420px)}}
</style>

